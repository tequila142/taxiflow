function carUtil(c) { const from = iso(addDays(today0(), -29)); return new Set(S.shifts.filter(s => s.carId === c.id && s.date >= from).map(s => s.date)).size / 30 * 100; }
function vAnalytics() {
  const u = UI.an, months = lastMonths(u.period);
  const inc = months.map(m => S.income[m.key] || 0), exp = months.map(m => expSum(m.key));
  const sInc = inc.reduce((a, b) => a + b, 0), sExp = exp.reduce((a, b) => a + b, 0);
  const kmM = fleetKm(monthPeriods(months));
  const util = S.cars.map(c => ({ label: `${c.model}`, value: Math.round(carUtil(c)), color: S1 })).sort((a, b) => b.value - a.value);
  const avgUtil = util.reduce((a, x) => a + x.value, 0) / Math.max(util.length, 1);
  const act = S.drivers.map(d => ({ label: d.name, value: monthShifts(d.id).length, color: S1 })).sort((a, b) => b.value - a.value).slice(0, 10);
  const toCnt = months.map(m => S.maint.filter(x => x.status === 'done' && monthKey(x.date) === m.key).length);
  const toCost = S.maint.filter(x => x.status === 'done' && months.some(m => m.key === monthKey(x.date))).reduce((a, x) => a + x.cost, 0);
  const cnt = k => S.cars.filter(c => c.status === k).length;
  chart(() => lineChart('anInc', { labels: months.map(m => m.label), tips: months.map(m => m.full), series: [{ name: 'Доходы', color: S1, values: inc }, { name: 'Расходы', color: S2, values: exp }], tfmt: rub, h: 250 }));
  chart(() => donut('anSt', Object.entries(CAR_ST).map(([k, s]) => ({ label: s.label, value: cnt(k), color: s.color })), { sub: 'автомобилей' }));
  chart(() => barChart('anExp', { labels: months.map(m => m.label), tips: months.map(m => m.full), series: Object.entries(EXP).map(([k, e]) => ({ name: e.label, color: e.color, values: months.map(m => expSum(m.key, k)) })), tfmt: rub, h: 230 }));
  chart(() => barChart('anKm', { labels: months.map(m => m.label), tips: months.map(m => m.full), series: [{ name: 'Пробег парка', color: S1, values: kmM }], tfmt: km, h: 230, labelLast: true }));
  chart(() => barChart('anTo', { labels: months.map(m => m.label), tips: months.map(m => m.full), int: true, series: [{ name: 'Выполнено ТО и ремонтов', color: S3, values: toCnt }], tfmt: v => fmt(v), fmt: v => fmt(v), h: 200, padL: 34 }));
  return `<div class="ph"><div><h1>Аналитика</h1><p>Доходы, расходы, пробег и загрузка парка</p></div><div class="acts"><div class="seg">${[[3, '3 месяца'], [6, '6 месяцев']].map(o => `<button class="${u.period === o[0] ? 'on' : ''}" onclick="UI.an.period=${o[0]};render()">${o[1]}</button>`).join('')}</div><button class="btn btn-outline" onclick="App.exportCSV()">${ic('upload', 16)} Экспорт CSV</button></div></div>
  <div class="grid mb16" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
    <div class="kpi"><div class="kpi-l"><span class="kpi-ic" style="background:${S1}1f;color:${S1}">${ic('trend', 16)}</span>Доходы</div><div class="kpi-vr"><div class="kpi-v">${compact(sInc)} ₽</div>${spark(inc, S1, 60, 26)}</div><div class="kpi-s">аренда от водителей</div></div>
    <div class="kpi"><div class="kpi-l"><span class="kpi-ic" style="background:${S2}1f;color:${S2}">${ic('wallet', 16)}</span>Расходы</div><div class="kpi-vr"><div class="kpi-v">${compact(sExp)} ₽</div>${spark(exp, S2, 60, 26)}</div><div class="kpi-s">${Math.round(sExp / Math.max(sInc, 1) * 100)}% от доходов</div></div>
    <div class="kpi"><div class="kpi-l"><span class="kpi-ic" style="background:var(--good-soft);color:var(--good-ink)">${ic('ruble', 16)}</span>Прибыль</div><div class="kpi-v" style="color:${sInc - sExp >= 0 ? 'var(--good-ink)' : 'var(--bad-ink)'}">${compact(sInc - sExp)} ₽</div><div class="kpi-s">маржа ${Math.round((sInc - sExp) / Math.max(sInc, 1) * 100)}%</div></div>
    <div class="kpi"><div class="kpi-l"><span class="kpi-ic">${ic('gauge', 16)}</span>Пробег парка</div><div class="kpi-v">${compact(kmM.reduce((a, b) => a + b, 0))} км</div><div class="kpi-s">≈ ${fmt(kmM.reduce((a, b) => a + b, 0) / months.length / Math.max(S.cars.length, 1))} км на авто в месяц</div></div>
    <div class="kpi"><div class="kpi-l"><span class="kpi-ic">${ic('pie', 16)}</span>Загрузка парка</div><div class="kpi-v">${Math.round(avgUtil)}%</div><div class="kpi-s">дней на линии за 30 дней</div></div>
  </div>
  <div class="grid g21 mb16">
    <div class="card"><div class="card-h"><div><h3>Доходы и расходы</h3><div class="sub">По месяцам, ₽</div></div></div><div class="chart" id="anInc"></div></div>
    <div class="card"><div class="card-h"><div><h3>Автомобили по статусам</h3><div class="sub">Сейчас</div></div></div><div class="chart" id="anSt"></div></div>
  </div>
  <div class="grid g2 mb16">
    <div class="card"><div class="card-h"><div><h3>Расходы по категориям</h3><div class="sub">Топливо, ремонт, ТО, прочее</div></div></div><div class="chart" id="anExp"></div></div>
    <div class="card"><div class="card-h"><div><h3>Пробег</h3><div class="sub">Километры парка по месяцам</div></div></div><div class="chart" id="anKm"></div></div>
  </div>
  <div class="grid g3">
    <div class="card"><div class="card-h"><div><h3>Использование автомобилей</h3><div class="sub">Доля дней на линии, 30 дней</div></div></div>${hbars(util, { max: 100, fmt: v => v + '%' })}</div>
    <div class="card"><div class="card-h"><div><h3>Активность водителей</h3><div class="sub">Смен за 30 дней, топ-10</div></div></div>${hbars(act, { fmt: v => fmt(v) })}</div>
    <div class="card"><div class="card-h"><div><h3>ТО и ремонты</h3><div class="sub">Выполнено работ · ${rub(toCost)} за период</div></div></div><div class="chart" id="anTo"></div>
      <div class="divider"></div><div class="sm b mb12">Ближайшие</div>${S.maint.filter(m => m.status === 'planned' || m.status === 'progress').slice(0, 3).map(m => `<div class="row-b sm" style="padding:4px 0"><span>${esc(car(m.carId)?.model || '')} · ${esc(m.type.replace('Плановое ТО: масло и фильтры', 'Плановое ТО'))}</span>${badge(TO_ST, m.status)}</div>`).join('')}</div>
  </div>`;
}

  },
  userRole(id, v) { S.users.find(u => u.id === id).role = v; save(); toast('Роль изменена', v); },
  userDel(id) { const u = S.users.find(x => x.id === id); confirmBox('Удалить пользователя?', `${u.name} потеряет доступ к рабочему пространству.`, 'Удалить', () => { S.users = S.users.filter(x => x.id !== id); save(); render(); toast('Пользователь удалён'); }, true); },
  setPlan(k) {
    const p = PLANS[k];
    modal({ title: `Переход на ${p.name}`, sub: `${p.price} / ${p.per}`, body: `<ul class="col" style="list-style:none;gap:8px">${p.feats.map(f => `<li class="row">${ic('check', 16, 2.5)}${f}</li>`).join('')}</ul><div class="plan-hint mt16">${ic('info', 18)}<div class="sm">Это демо: оплата не списывается, тариф переключится сразу.</div></div>`, ok: 'Подтвердить',
      onOk: () => { S.workspace.plan = k; addEvent('good', `Тариф изменён на ${p.name}`); save(); render(); toast(`Тариф ${p.name} подключён`, p.feats.slice(0, 2).join(' · ')); } });
  },
  /* шапка */
  menu() { const a = $('#app'); if (a) a.classList.toggle('menu-open'); },
  create(btn) {
    const it = (icon, label, fn) => `<button class="mi" onclick="closeDD();${fn}">${ic(icon, 16)}${label}</button>`;
    toggleDD('create', it('car', 'Автомобиль', "openForm('cars')") + it('users', 'Водитель', "openForm('drivers')") + it('gauge', 'Пробег', "go('#/app/mileage')") + it('wallet', 'Расход', "openForm('expenses')") + it('wrench', 'Запись ТО', "openForm('maintenance')") + it('file', 'Документ', "openForm('docs')") + '<div class="dd-sep"></div>' + it('zap', 'Автоматизация', 'App.newAuto()') + it('blocks', 'Экран в конструкторе', "go('#/app/builder');setTimeout(()=>App.cxNew(),30)"), btn);
  },
  notifs(btn) {
    const html = `<div class="nh"><b>Уведомления</b>${unread() ? `<button class="link sm" onclick="App.readAll()">Прочитать все</button>` : ''}</div><div class="notif-list">${S.notifs.map(n => `<div class="notif ${n.read ? '' : 'unread'}"><span class="li-ic ${n.kind === 'auto' ? 'brand' : n.kind}" style="width:30px;height:30px">${ic(n.kind === 'auto' ? 'zap' : n.kind === 'bad' ? 'alert' : 'bell', 14)}</span><div class="grow"><div>${esc(n.text)}</div><div class="xs muted">${timeAgo(n.ts)}</div></div></div>`).join('') || '<div class="empty">Уведомлений нет</div>'}</div>`;
    toggleDD('notif', html, btn);
  },
  readAll() { S.notifs.forEach(n => n.read = true); save(); updateBadges(); closeDD(); toast('Все уведомления прочитаны', '', 'info'); },
  meMenu(btn) {
    const it = (icon, label, fn) => `<button class="mi" onclick="closeDD();${fn}">${ic(icon, 16)}${label}</button>`;
    toggleDD('me', `<div style="padding:10px 10px 8px"><div class="b">${esc(S.profile.name)}</div><div class="xs muted">${esc(S.profile.email)}</div></div><div class="dd-sep"></div>` + it('user', 'Профиль', "UI.set='profile';go('#/app/settings')") + it('card', 'Тариф и оплата', "UI.set='plan';go('#/app/settings')") + it('home', 'Сайт TaxiFlow', "go('#/')") + it('refresh', 'Сбросить демо-данные', 'App.reset()') + '<div class="dd-sep"></div>' + it('logout', 'Выйти', "go('#/')"), btn);
  },
  search(v) {
    const wrap = $('#gsearch').parentElement; const old = wrap.querySelector('.search-res'); if (old) old.remove();
    v = v.trim().toLowerCase(); if (v.length < 2) return;
    const cs = S.cars.filter(c => `${c.model} ${c.plate} ${c.plate.replace(/\s/g, '')}`.toLowerCase().includes(v)).slice(0, 5);
    const ds = S.drivers.filter(d => `${d.name} ${d.phone}`.toLowerCase().includes(v)).slice(0, 5);
    const docs = S.docs.filter(d => `${d.type} ${d.number}`.toLowerCase().includes(v)).slice(0, 4);
    const pages = Object.entries(TITLES).filter(([k, t]) => k !== 'screen' && t.toLowerCase().includes(v)).slice(0, 3);
    const it = (icon, t, s, h) => `<button class="mi" onmousedown="event.preventDefault();$('#gsearch').value='';this.closest('.search-res').remove();go('${h}')"><span class="li-ic" style="width:28px;height:28px">${ic(icon, 14)}</span><div style="min-width:0"><div class="b sm">${esc(t)}</div><div class="xs muted">${esc(s)}</div></div></button>`;
    const box = document.createElement('div'); box.className = 'search-res';
    box.innerHTML = (pages.length ? '<div class="grp">Разделы</div>' + pages.map(([k, t]) => it('chevR', t, 'Раздел', '#/app/' + k)).join('') : '') + (cs.length ? '<div class="grp">Автомобили</div>' + cs.map(c => it('car', c.model, c.plate + ' · ' + CAR_ST[c.status].label, '#/app/cars/' + c.id)).join('') : '') + (ds.length ? '<div class="grp">Водители</div>' + ds.map(d => it('user', d.name, d.phone, '#/app/drivers/' + d.id)).join('') : '') + (docs.length ? '<div class="grp">Документы</div>' + docs.map(d => it('file', d.type, d.number + ' · ' + ownerName(d), '#/app/documents')).join('') : '') || '<div class="empty" style="padding:18px">Ничего не найдено</div>';
    wrap.appendChild(box);
  },
};

/* =========================================================
   СТАРТ
   ========================================================= */
load();
window.addEventListener('hashchange', render);
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { TT.hide(); drawCharts(); }, 150); });
window.addEventListener('scroll', () => { const n = $('#lpnav'); if (n) n.classList.toggle('scrolled', scrollY > 8); TT.hide(); }, { passive: true });
render();
</script>
</body>
</html>
